# 로봇청소기에 대한 강아지 반응 유형 규칙 사전 (팀이 자유롭게 수정). 부분 문자열 일치, 복수 매칭 모두 기록.
labels:
  fear:        # 공포·경계
    [무서워, 겁, 짖, 도망, 숨, 피해, 벌벌, 경계, 으르렁]
  curious:     # 호기심
    [궁금, 쳐다, 냄새, 킁킁, 관찰, 구경]
  play:        # 놀이·추격
    [쫓아, 따라다, 올라타, 타고, 놀아, 장난, 신나, 잡으]
  indifferent: # 무관심
    ["신경 안", "관심 없", 무관심, "그냥 자", "그냥 누워"]
  adapted:     # 적응
    ["처음엔", "이제는", 익숙, 적응, 괜찮아졌]

# 부정어 처리: 단어 앞(neg_prefix)·뒤(neg_suffix_regex)에 부정 표현이 붙으면 그 매칭은 버린다.
# ("안 무서워", "안 짖", "무서워하지 않아", "짖지도 않고")
negation:
  neg_prefix: ["안", "못", "전혀", "하나도"]
  neg_suffix_regex: '^[가-힣]{0,3}\s*(도\s*)?(않|못)'
  exempt_labels: [indifferent]   # 사전 자체에 부정이 들어 있는 라벨은 부정어 처리를 건너뜀
