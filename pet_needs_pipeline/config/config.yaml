            "강아지 밥", "강아지 사료", "강아지 식단", "강아지 식사", "반려견 급여", "강아지 사료 거부", "강아지 밥 안먹음",
            "강아지 사료 알레르기", "강아지 소화", "강아지 식욕", "강아지 간식 관리", "노견 식사", "강아지 체중 관리", "1인가구 강아지"]

# ---------------- 분석용 사전 ----------------
feature_labels:
  storage: "① 생식·사료 보관"
  auto_feed: "② 자동 급여"
  vacuum: "③ 진공포장"
  water: "④ 물 급여"
  nutrition: "⑤ 영양 설계"

# 문서·문장에 이 단어가 하나라도 있으면 해당 기능 언급으로 본다 (부분 문자열 일치)
feature_dict:
  storage: ["보관", "눅눅", "산패", "벌레", "밀폐", "보관통", "해동", "냉동실", "냉장", "유통기한", "소분 용기", "상했", "상하"]
  auto_feed: ["자동급식", "급식기", "자동 급식", "예약 급여", "급여 시간", "밥 시간", "출근", "외출", "여행", "급여량", "배식"]
  vacuum: ["진공", "밀봉", "실링", "지퍼백", "소분 포장", "성에", "포장기"]
  water: ["물그릇", "급수기", "정수기", "음수량", "물 안 마", "물을 안", "물때", "물 갈", "엎어", "엎질", "엎음", "엎었"]
  nutrition: ["영양", "칼슘", "인 비율", "단백질", "칼로리", "kcal", "레시피", "식단", "보충제", "결핍", "성분표", "배합"]

feed_type_dict:
  생식: ["생식", "바프", "barf", "생고기", "날고기", "생육"]
  화식: ["화식", "자연식", "수제식", "익혀서", "수제 사료"]
  건사료: ["건사료", "키블", "사료 알갱이", "알갱이", "그레인프리", "로얄캐닌", "오리젠", "나우 사료"]

animal:
  dog_terms: ["강아지", "반려견", "댕댕", "멍멍", "강쥐", "견주", "애견", "개밥", "푸들", "말티즈", "포메", "시바", "비숑", "리트리버", "진돗개", "치와와", "닥스", "웰시코기", "슈나우저", "시츄", "요크셔", "보더콜리"]
  cat_terms: ["고양이", "냥이", "고영희", "캣", "묘종", "고양이 모래", "츄르", "코숏", "러시안블루", "먼치킨", "스코티시", "페르시안", "캣타워"]

# ---------------- 전처리 ----------------
ad_patterns: ["소정의 원고료", "원고료", "업체로부터 제공", "제품을 제공받", "무상으로 제공", "무상 제공", "지원받아", "제공받아 작성", "협찬", "체험단", "체험팩", "서포터즈", "유료광고", "#광고", "할인코드", "쿠폰 코드", "구매 링크", "분양", "파트너스 활동", "수수료를 제공받", "수수료를 받", "쇼핑 커넥트", "쇼핑커넥트", "공구", "공동구매", "레뷰", "리뷰노트"]
max_links: 3               # 본문 링크가 이 개수 이상이면 광고로 본다
min_body_len: 10           # 공백 제외 글자 수
near_dup_threshold: 0.9    # 본문 유사도(0~1) 이 값 이상이면 중복

# ---------------- 분석 ----------------
min_feature_docs: 50       # 기능 언급 문서가 이보다 적으면 '표본 부족'으로 표시
lda:
  n_topics: 8
  auto_k: false            # true면 k_candidates 중 UMass coherence가 가장 높은 k 사용
  k_candidates: [5, 6, 8, 10, 12, 15]
  max_features: 3000
  min_df: 3
  max_df: 0.5
  top_n_words: 10
  residual_only: true      # 기능 사전에 안 걸린 문서만으로 토픽 → 신규 페인포인트
  exclude_query_terms: true  # 검색 키워드·급여 방식 단어를 토픽에서 제외

paths:
  raw: data/raw
  processed: data/processed
  figures: outputs/figures
  tables: outputs/tables
  logs: logs
  stopwords: config/stopwords.txt
  user_dict: config/user_dict.txt
  negative_words: config/negative_words.txt
  positive_words: config/positive_words.txt

# ---------------- 인스타그램 (Apify) ----------------
# 기간 필터는 위 period_days(365일)를 그대로 쓴다. 반응 태그만 결과가 적으면 기간을 늘린다.
instagram:
  period_days: 730         # 인스타 전용 기간(2년). 목표 1,000건에 못 미치면 1095(3년)로 늘린다. 다른 소스는 위 period_days(365) 유지
  restore_file: config/ig_dogfilter_restore.csv   # 강아지 단어 필터에서 제거됐지만 검수 후 살린 게시물 url_hash 목록
  expand_tags: ["로봇청소기강아지", "강아지로봇청소기", "로청강아지", "로봇청소기무서워"]
  expand_min_posts: 10     # 365일 적용 후 게시물이 이보다 적으면
  expand_days: 730         # 이 기간으로 확장 (강아지 반응은 제품 버전과 무관)
  # 강아지 판별 범위(모든 robot 태그 공통): 검색 태그와 변형(robot 층 태그 전체, 띄어쓰기·_ 변형)만 제외한 해시태그 + 본문
  intersection_tags: ["로봇청소기"]    # 교집합 방식 실험 태그 (판정 제안을 적중률 기준으로 계산, 직접 태그와 비교표 생성)
  compare_frozen: true                 # true 이고 ig_intersection_compare.csv 가 있으면 덮어쓰지 않는다 (선정 근거 보존)
  compare_baseline: "로봇청소기강아지"   # 교집합 태그와 나란히 비교할 직접 태그
  tag_overrides:                       # 태그별 수량 (CLI --posts/--comments 가 있으면 그쪽이 우선)
    로봇청소기: {posts: 50, comments: 10}
  price_per_1000: {posts: 2.3, comments: 2.3}   # Starter 실제 청구 단가($/1,000건, 2026-09-30 Apify 실행 기록으로 확인). 무료 플랜은 게시물 2.6 / 댓글 2.6
  use_animal_dog_terms: true           # 강아지 판별에 animal.dog_terms(견종·애칭·견주 등)를 합친다 (모든 robot 태그 공통)
  emotion_clean:                       # 대체재 감정 데이터 정제 (python main.py --source instagram --emotion-clean)
    cat_extra: ["집사"]                 # animal.cat_terms 에 더할 고양이 단어. 고양이 단어가 있고 강아지 판별에 안 걸리면 제거
    dog_emoji: ["🐶", "🐕", "🐩", "🐾"]  # 강아지 판별 사전에 더하는 이모지
    dog_context_words: ["혼자", "외출", "출근", "퇴근", "집에 두고", "집 비", "여행", "보고싶"]   # 감정 키워드와 함께 나오면 target=dog
    security_words: ["해킹", "보안", "유출", "사생활", "개인정보", "암호화"]                     # target=security
    concern_words: ["걱정", "불안", "무서", "찝찝", "우려", "망설", "두려"]                      # 보안 단어와 함께 나오면 '사용자 우려'로 보고 홍보 제거 대상에서 면제
    review_emotions: ["안심", "걱정", "불안"]
    review_max: 100

# ---------------- 스레드 (Apify) ----------------
# 기간은 위 period_days(365일)를 그대로 쓴다 (액터 입력 postedAfter = 오늘 - period_days).
threads:
  actors: {posts: automation-lab/threads-scraper, replies: automation-lab/threads-replies-scraper}
  search_sort: recent                   # 액터 입력 searchSort (top | recent)
  keywords_csv: config/threads_keywords.csv
  relevance_words: config/threads_relevance_words.txt
  # 단가($): Apify Starter(BRONZE 티어) 기준, 액터 스토어 과금표(2026-10 확인). 게시물/답글 건당 + 실행당 시작 비용
  price: {post: 0.00435, reply: 0.00026162, start_posts: 0.0174, start_replies: 0.005}
  korean_min_ratio: 0.3                 # 글자(한글·영문·가나·한자) 중 한글 비율이 이 이상이면 '한국어 글'로 본다
  complaint_words: ["별로", "불편", "끊겨", "느려", "비싸", "소용없", "의미없", "더 미안", "보기만", "안 보여", "배터리"]

