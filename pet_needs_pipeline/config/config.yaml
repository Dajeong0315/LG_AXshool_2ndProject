# ==============================================================
# 반려견 보호자 니즈 크롤링·분석 파이프라인 설정
# - 이 파일만 고치면 수집량·키워드·기간·대기시간을 바꿀 수 있다.
# - 계정 아이디·비밀번호는 절대 여기에 쓰지 않는다 (카페 로그인은 브라우저에서 직접).
# - API 키는 환경변수로만 받는다: NAVER_CLIENT_ID, NAVER_CLIENT_SECRET, YOUTUBE_API_KEY
# ==============================================================

test_mode: false           # true: 사이트당 test_limit_per_site 건만 수집하고 전체 흐름 검증
test_limit_per_site: 10
scale: 10                  # 사이트별 target에 곱한다. 1 → 약 1,000건 / 10 → 약 1만 건

period_days: 365           # 실행일 기준 최근 N일 글만 (최근 1년)

wait:                      # 요청 사이 무작위 대기(초)
  min_sec: 1.0
  max_sec: 3.0

respect_robots: true       # robots.txt에서 막힌 경로는 본문을 가져오지 않는다
user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36 (student-research; LG-AX-School)"
anonymize_url: false       # true면 url 칸에 원본 대신 해시를 저장 (원문 검토가 필요 없을 때)
query_prefix: "강아지"      # 키워드에 강아지/반려견이 없으면 앞에 붙여 검색

# 사이트 목표량을 키워드 그룹별로 나누는 비율 (합 1.0). explore = 기능 중립 탐색 키워드
group_ratio:
  explore: 0.25
  storage: 0.15
  auto_feed: 0.15
  vacuum: 0.15
  water: 0.15
  nutrition: 0.15

# ---------------- A 코퍼스(견주 고민 분석)에 넣을 source ----------------
# data/raw/{source}.csv 중 여기 적힌 것만 전처리·분석에 들어간다.
# instagram(고민 도출용이 아님)과 threads(파일럿 관련도 확인 후 결정)는 기본 제외. 편입하려면 아래 목록에 이름을 추가한다.
corpus:
  sources: [naver_blog, naver_kin, naver_cafe, youtube, manual_reviews, shop_reviews]

# ---------------- 수집 사이트 (혼합안: 커뮤니티 70% + 리뷰 30%) ----------------
sites:
  naver_blog:
    enabled: true
    target: 450            # ×scale → 4,500
    fetch_body: true       # false면 검색 API 요약문만 사용
  naver_kin:
    enabled: true
    target: 80             # 작성일은 질문 페이지에서 읽는다 (없으면 제외)
    old_streak_stop: 30    # 기간 밖 글이 연속 이만큼 나오면 그 키워드는 중단 (시간 절약)
  naver_cafe:
    enabled: false         # 테스트 결과 robots.txt가 카페 본문 경로를 막음 → 매니저 동의 받은 카페만 켤 것
    target: 200
    cafe_ids: []           # 예: ["dogpalza"] — 비우면 검색 결과의 모든 카페. 회원공개 카페는 매니저 동의 후 추가
    respect_robots: true   # 매니저 서면 동의를 받은 카페만 대상으로 할 때에 한해 false 검토
  youtube:
    enabled: true
    target: 470            # ×scale → 4,700 (검색 1회 = 100 unit, 하루 10,000 unit 한도)
    videos_per_keyword: 10
    comments_per_video: 100
  manual_reviews:          # 쿠팡 등 자동 수집이 막힌 곳의 리뷰를 팀원이 CSV로 붙여넣는 폴더
    enabled: true
    target: 300
    folder: data/manual    # 컬럼: source,url,title,body,date,rating,keyword
    require_dog_word: false
    keywords:              # CSV의 keyword 칸에 이 값 중 하나를 적는다 (제품 카테고리)
      storage: ["사료 보관통", "생식 소분 용기"]
      auto_feed: ["자동급식기", "습식 자동급식기"]
      vacuum: ["진공포장기"]
      water: ["자동급수기", "강아지 정수기"]
      explore: ["급여 저울", "슬로우 식기", "펫 홈카메라", "급식 매트"]
  shop_reviews:            # robots.txt가 허용하는 쇼핑몰만. 선택자는 사이트 구조를 보고 직접 채운다
    enabled: false
    target: 0
    require_dog_word: false
    max_pages: 10
    products: []           # 예: [{url: "https://...", keyword: "자동급식기"}]
    selectors:
      review_item: ""      # 리뷰 1개를 감싸는 요소
      body: ""
      date: ""
      rating: ""           # 별점 텍스트(숫자)가 들어있는 요소, 없으면 비움
      next_page: ""        # 다음 페이지 버튼
    keywords:
      storage: ["사료 보관통"]
      auto_feed: ["자동급식기"]
      vacuum: ["진공포장기"]
      water: ["자동급수기"]
      explore: []

naver_api:
  mode: hub                # legacy = 네이버 개발자센터 키 / hub = 네이버 클라우드 API HUB 키
  base_url: "https://openapi.naver.com/v1/search"
  hub_base_url: "https://naverapihub.apigw.ntruss.com/search/v1"
  display: 100
  max_start: 1000

youtube_api:
  base_url: "https://www.googleapis.com/youtube/v3"

